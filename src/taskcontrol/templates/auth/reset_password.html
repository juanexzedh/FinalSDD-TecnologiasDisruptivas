{% extends "base.html" %}
{% block content %}
<h1>Nueva contraseña</h1>
<form method="post" action="{{ url_for('recovery.reset_password', token=token) }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Nueva contraseña (mín. 8, con letra y número) <input type="password" name="new_password" required></label>
  <label>Confirmar contraseña <input type="password" name="confirm_password" required></label>
  <button type="submit">Cambiar contraseña</button>
</form>
{% endblock %}
