{% extends "base.html" %}
{% block content %}
<h1>Recuperar contraseña</h1>
<form method="post" action="{{ url_for('recovery.forgot_password') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Correo registrado <input type="email" name="email" value="{{ email or '' }}" required></label>
  <button type="submit">Enviar instrucciones</button>
</form>
<p><a href="{{ url_for('auth.login') }}">Volver a iniciar sesión</a></p>
{% endblock %}
