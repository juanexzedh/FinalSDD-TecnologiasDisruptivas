{% extends "base.html" %}
{% block content %}
<h1>Iniciar sesión</h1>
<form method="post" action="{{ url_for('auth.login') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Correo <input type="email" name="email" value="{{ email or '' }}" required></label>
  <label>Contraseña <input type="password" name="password" required></label>
  <button type="submit">Entrar</button>
</form>
<p><a href="{{ url_for('recovery.forgot_password') }}">¿Olvidaste tu contraseña?</a></p>
<p>¿No tienes cuenta? <a href="{{ url_for('auth.register') }}">Regístrate</a></p>
{% endblock %}
