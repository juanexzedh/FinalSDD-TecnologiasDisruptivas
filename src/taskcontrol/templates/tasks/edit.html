{% extends "base.html" %}
{% block content %}
<h1>Editar tarea</h1>
{% if task %}
<form method="post" action="{{ url_for('tasks.edit_task', task_id=task.id) }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% include "tasks/_form_fields.html" %}
  <button type="submit">Guardar</button> <a href="{{ url_for('tasks.list_tasks') }}">Cancelar</a>
</form>
{% endif %}
{% endblock %}
